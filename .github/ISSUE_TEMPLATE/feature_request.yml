name: Feature request
description: Suggest a new feature or enhancement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, check `docs/ROADMAP.md` — it may
        already be planned (or deliberately dropped).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature and how it should behave.
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      description: Which roadmap tier does this belong in?
      options:
        - v1 Core
        - v1.5 Extras (flag-gated)
        - v2 Future
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about.
